name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lane-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd .github/scripts && node --test
      - run: node .github/scripts/lane-guard.mjs
  # ponytail: per-lane test jobs get added by each lane's first task (T02, T10, T12) once they have a package.json.
