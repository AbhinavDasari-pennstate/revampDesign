name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lane-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd .github/scripts && node --test
      - run: node .github/scripts/lane-guard.mjs
  # ponytail: per-lane test jobs get added by each lane's first task (T10, T12, and Lane A T08) once they have a package.json.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd contracts && npm ci && node --test
      - run: node contracts/validate.mjs --cross contracts/fixtures/sample
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd contracts && npm ci
      # readiness.test.mjs runs the real scout stage against the local sample site
      - run: cd lanes/a-scout && npm ci && npx playwright install --with-deps chromium
      - run: cd orchestrator && node --test
  a-scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd contracts && npm ci
      - run: cd lanes/a-scout && npm ci && npx playwright install --with-deps chromium
      - run: cd lanes/a-scout && node --test
