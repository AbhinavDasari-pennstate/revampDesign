name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lane-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd .github/scripts && node --test
      - run: node .github/scripts/lane-guard.mjs
  b-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd lanes/b-design && npm ci && npx playwright install --with-deps chromium
      - run: cd lanes/b-design && node --test
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd contracts && npm ci && node --test
      - run: node contracts/validate.mjs --cross contracts/fixtures/sample
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd contracts && npm ci
      # readiness.test.mjs runs every lane's real stage CLI against the sample, so it needs every lane's dependencies
      - run: cd lanes/a-scout && npm ci && npx playwright install --with-deps chromium
      - run: cd lanes/b-design && npm ci
      - run: cd lanes/c-build && npm ci
      - run: cd orchestrator && node --test
  a-scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd contracts && npm ci
      - run: cd lanes/a-scout && npm ci && npx playwright install --with-deps chromium
      - run: cd lanes/a-scout && node --test
  c-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd contracts && npm ci
      - run: cd lanes/c-build && npm ci && npx playwright install --with-deps chromium
      - run: cd lanes/c-build && node --test
  # The three web folders (plan/web-plan.md) each get a job now, because Lanes B and C cannot edit this file. A job passes
  # while its folder has no test directory yet and runs `node --test` once web/<folder>/test exists. web/ has no dependencies;
  # web-server installs the ajv of contracts/ only, so its tests check every response against the contract schemas.
  web-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: cd contracts && npm ci
      - run: |
          if [ -d web/server/test ]; then
            cd web/server && node --test
          else
            echo "web/server has no tests yet"
          fi
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: |
          if [ -f web/ui/package.json ]; then
            cd web/ui && npm ci && npm test && npm run build
          else
            echo "web/ui has no React app yet"
          fi
  web-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      # T45 runs a browser check with Playwright from lanes/c-build. When that test lands, add before the next step:
      # cd lanes/c-build && npm ci && npx playwright install --with-deps chromium
      - run: |
          if [ -d web/viewer/test ]; then
            cd web/viewer && node --test
          else
            echo "web/viewer has no tests yet"
          fi
